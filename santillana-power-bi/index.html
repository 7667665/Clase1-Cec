<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power BI desde cero</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#20394b;font:18px/1.55 Arial,sans-serif}header,footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 5%;background:white}header{border-bottom:4px solid #e6b526;font-size:14px;font-weight:bold}main{max-width:1150px;margin:15px auto;background:white;padding:clamp(24px,5vw,60px);min-height:75vh}h1{font-size:clamp(28px,4vw,48px);line-height:1.15}button,select{font:inherit;padding:9px;border:1px solid #aab9c4;background:white;color:inherit;border-radius:4px;cursor:pointer}button:disabled{opacity:.4}.note{margin-top:24px;border-left:4px solid #e6b526;background:#fff9e8;padding:15px}.flow,.mock{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.flow b,.mock>*{border:1px solid #ccd6dd;padding:15px;background:#f4f7f9}.mock section{flex:1;min-height:150px}.mock aside{font-size:14px}table{border-collapse:collapse;width:100%;margin:15px 0}td,th{padding:8px;border:1px solid #dce4e9;text-align:left}th{background:#175478;color:white}.kpi{padding:12px 24px;border:1px solid #ccd6dd;display:inline-block;margin:15px 0}.kpi h1,.kpi h2{margin:3px 0;color:#175478}.chartrow{display:grid;grid-template-columns:105px 1fr 30px;gap:12px;align-items:center;margin:10px 0}.bar{height:24px;background:#e6b526}details{padding:12px;border-bottom:1px solid #ddd}summary{cursor:pointer}.pie{width:150px;height:150px;border-radius:50%;background:conic-gradient(#e6b526 0 55.56%,#175478 55.56% 100%)}@media(max-width:650px){footer{flex-wrap:wrap}main{margin:8px}table{font-size:13px}}</style></head><body><header><span>CEC-EPN · SANTILLANA</span><span id="num"></span></header><main id="slide"></main><footer><button id="prev">← Anterior</button><select id="jump" aria-label="Ir a diapositiva"></select><button id="next">Siguiente →</button></footer><script>const slides=[["Power BI desde cero","<h2>De los datos a las decisiones</h2><p>CEC-EPN · Capacitación Santillana</p>","Aprender a construir un informe visual con una sola tabla de Excel."],["¿Qué es Power BI?","Power BI es una herramienta de inteligencia de negocios que permite convertir datos en informes visuales e interactivos.","Ejemplo: conocer qué libros se venden más y en qué ciudades."],["¿Para qué sirve?","<div class='flow'><b>Visualizar ventas</b><b>Comparar resultados</b><b>Detectar tendencias</b></div>","Un informe ayuda a responder preguntas de negocio sin revisar cientos de filas."],["Excel frente a Power BI","<table><tr><th>Excel</th><th>Power BI</th></tr><tr><td>Hojas y celdas</td><td>Informes visuales</td></tr><tr><td>Edición de registros y cálculos</td><td>Exploración y comparación de datos</td></tr><tr><td>Tablas y gráficos</td><td>Visuales conectados mediante filtros</td></tr></table>","Ambos se complementan: Excel puede ser el origen de un informe."],["Instalación","Descarga Power BI Desktop para Windows desde Microsoft Store o <a href='https://www.microsoft.com/es-es/power-platform/products/power-bi/desktop'>Microsoft</a>.","Abre Power BI Desktop y crea un informe en blanco."],["Interfaz de Power BI","<div class='mock'><aside>▣ Informe<br>▤ Tabla<br>◇ Modelo</aside><section>Lienzo del informe<br><br> Aquí se colocan los gráficos</section><aside>Visualizaciones<br>Datos<br>Filtros</aside></div>","Esquema ilustrativo: la ubicación exacta de los paneles depende de la versión."],["Una sola tabla de ventas","<div id='data'></div><button onclick='csv()'>Descargar datos CSV de práctica</button>","Cada fila representa una venta. Puedes abrir el CSV en Excel y guardarlo como XLSX; usa punto y coma como separador si es necesario."],["Importar los datos","<ol><li>Inicio → Obtener datos → Libro de Excel.</li><li>Selecciona el archivo guardado.</li><li>Marca la hoja de ventas en el Navegador.</li><li>Pulsa Cargar.</li></ol>","Comprueba que Unidades se reconozca como número."],["Gráfico de barras","<ol><li>Selecciona un gráfico de barras agrupadas.</li><li>Agrega Libro al eje de categorías.</li><li>Agrega Unidades al eje de valores.</li><li>Selecciona Suma de Unidades.</li></ol><div class='bars' id='staticbars'></div>","Permite comparar los libros más vendidos."],["Gráfico circular","<p>Selecciona gráfico circular. Agrega Ciudad a Leyenda y Unidades a Valores (Suma).</p><div class='pie'></div><p>Quito: 55,6 % · Guayaquil: 44,4 %</p>","Úsalo para comparar partes de un total cuando existen pocas categorías."],["Tarjeta de indicador","<div class='kpi'><small>UNIDADES VENDIDAS</small><h1>27</h1></div>","Inserta una tarjeta y agrega Unidades como suma. No necesitas escribir fórmulas."],["Segmentador de datos","Inserta una segmentación de datos y agrega Ciudad. Selecciona una ciudad para filtrar los visuales de la página.","Puedes seleccionar Quito, Guayaquil o limpiar la selección para volver al total."],["Informe interactivo","<label>Ciudad <select id='city' onchange='render()'><option>Todas</option><option>Quito</option><option>Guayaquil</option></select></label><div class='kpi'><small>UNIDADES VENDIDAS</small><h2 id='total'></h2></div><div id='chart'></div>","Simulación didáctica del comportamiento de los visuales de Power BI."],["Diseño del informe","Elige un título, alinea los gráficos, utiliza colores consistentes y evita elementos innecesarios.","En Power BI Desktop estamos diseñando una página de informe; un dashboard formal se crea en el servicio web."],["Guardar y compartir","Archivo → Guardar como → archivo .pbix. Para publicar, usa Inicio → Publicar con una cuenta autorizada.","Compartir informes en línea depende de los permisos y licencias disponibles."],["Práctica de 10 minutos","<ol><li>Importa la tabla de ventas.</li><li>Crea un gráfico de barras por libro.</li><li>Crea una tarjeta de unidades.</li><li>Agrega un segmentador por ciudad.</li></ol><button onclick='timer()'>Iniciar temporizador</button> <strong id='clock'>10:00</strong>","Comprueba que el total general sea 27 y guarda tu informe."],["Comprobación final","<details><summary>¿Qué visual muestra un único indicador?</summary>La tarjeta.</details><details><summary>¿Qué visual permite comparar libros?</summary>El gráfico de barras.</details><details><summary>¿Cómo filtrar por ciudad?</summary>Con un segmentador de datos.</details>","Fin de la clase."]],rows=[['Matemática','Quito',10],['Lengua','Quito',5],['Matemática','Guayaquil',8],['Ciencias','Guayaquil',4]];let i=0,tick;const $=x=>document.getElementById(x);slides.forEach((s,j)=>$('jump').add(new Option((j+1)+'. '+s[0],j)));function bars(r){let s={};r.forEach(x=>s[x[0]]=(s[x[0]]||0)+x[2]);return Object.entries(s).map(([k,v])=>'<div class="chartrow"><span>'+k+'</span><div class="bar" style="width:'+v/18*100+'%"></div><b>'+v+'</b></div>').join('')}function render(){let c=$('city').value,r=rows.filter(x=>c==='Todas'||x[1]===c);$('total').textContent=r.reduce((s,x)=>s+x[2],0);$('chart').innerHTML=bars(r)}function csv(){let b=new Blob(['\ufeffLibro;Ciudad;Unidades\r\n'+rows.map(x=>x.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Ventas_Santillana.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function show(){clearInterval(tick);$('num').textContent=(i+1)+' / '+slides.length;$('slide').innerHTML='<small>POWER BI · NIVEL INICIAL</small><h1>'+slides[i][0]+'</h1><div>'+slides[i][1]+'</div><div class="note">'+slides[i][2]+'</div>';$('jump').value=i;$('prev').disabled=i===0;$('next').disabled=i===slides.length-1;if($('data'))$('data').innerHTML='<table><tr><th>Libro</th><th>Ciudad</th><th>Unidades</th></tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>';if($('staticbars'))$('staticbars').innerHTML=bars(rows);if($('city'))render();window.scrollTo(0,0)}function move(n){i=Math.max(0,Math.min(slides.length-1,i+n));show()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('jump').onchange=e=>{i=+e.target.value;show()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});function timer(){clearInterval(tick);let t=600;$('clock').textContent='10:00';tick=setInterval(()=>{t--;$('clock').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t)clearInterval(tick)},1000)}show();</script></body></html>
