<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power BI | CEC-EPN</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#20394b;font:18px/1.6 Arial,sans-serif}header,footer{display:flex;justify-content:space-between;gap:12px;align-items:center;background:white;padding:14px 5%}header{border-bottom:4px solid #e9b526;font-size:14px;font-weight:bold}main{background:white;max-width:1150px;margin:16px auto;padding:clamp(24px,5vw,64px);min-height:75vh}h1{font-size:clamp(30px,5vw,52px);line-height:1.12;margin:14px 0 28px}small{color:#64748b}.note{border-left:4px solid #d9aa21;background:#fff9e7;padding:18px;margin-top:24px}button,select{font:inherit;padding:10px;border:1px solid #aabac7;background:white;border-radius:5px;color:#20394b;cursor:pointer}button:disabled{opacity:.35}table{border-collapse:collapse;width:100%}td,th{border:1px solid #dce4e9;text-align:left;padding:9px}th{background:#175478;color:white}.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin:25px 0}.flow b{background:#f2f6f9;border:1px solid #9fb3c1;padding:18px;border-radius:6px}details{padding:12px;border-bottom:1px solid #ddd}summary{cursor:pointer;font-weight:bold}.bar{background:#e9b526;height:26px;min-width:0;display:inline-block;vertical-align:middle}.chartrow{display:grid;grid-template-columns:105px 1fr 35px;gap:10px;align-items:center;margin:12px 0}@media(max-width:650px){main{margin:8px}footer{flex-wrap:wrap}table{font-size:13px}}</style></head><body><header><span>CEC-EPN · SANTILLANA · POWER BI</span><span id="num"></span></header><main id="slide"></main><footer><button id="prev">← Anterior</button><select id="jump" aria-label="Seleccionar diapositiva"></select><button id="next">Siguiente →</button></footer><script>const slides=[["Power BI","De Excel a un informe interactivo de ventas editoriales.","Objetivo: importar, limpiar, relacionar y visualizar datos sin escribir DAX."],["¿Qué es Power BI?","Herramienta de inteligencia de negocios para transformar datos en informes interactivos.","Desktop permite elaborar informes; el servicio web permite publicar y compartir según permisos y licencias."],["Flujo de trabajo","<div class='flow'><b>Excel</b> → <b>Power Query</b> → <b>Modelo</b> → <b>Informe</b></div>","Cada etapa tiene una función distinta: origen, preparación, relaciones y visualización."],["Instalación","Descarga Power BI Desktop desde Microsoft Store o el sitio oficial de Microsoft. Abre la aplicación en Windows.","<a href='https://www.microsoft.com/es-es/power-platform/products/power-bi/desktop'>Power BI Desktop</a>"],["Interfaz","<div class='flow'><b>Informe</b><b>Tabla</b><b>Modelo</b></div>","Informe: gráficos. Tabla: inspección de datos importados. Modelo: relaciones. Los nombres pueden variar por versión."],["Datos de práctica","<table><tr><th>IDLibro</th><th>Título</th></tr><tr><td>L01</td><td>Matemática</td></tr><tr><td>L02</td><td>Lengua</td></tr><tr><td>L03</td><td>Ciencias</td></tr></table><p>Clientes: C01 Colegio Norte; C02 Colegio Sur.</p>","Crea dos tablas de dimensiones en Excel."],["Tabla de ventas","<table><tr><th>IDVenta</th><th>IDLibro</th><th>IDCliente</th><th>Cantidad</th></tr><tr><td>V01</td><td>L01</td><td>C01</td><td>10</td></tr><tr><td>V02</td><td>L02</td><td>C01</td><td>5</td></tr><tr><td>V03</td><td>L01</td><td>C02</td><td>8</td></tr><tr><td>V04</td><td>L03</td><td>C02</td><td>4</td></tr></table>","Convierte cada rango en tabla con Ctrl + T y guarda el libro."],["Importar Excel","Inicio → Obtener datos → Excel → elegir archivo → seleccionar Libros, Clientes y Ventas.","Pulsa Transformar datos para revisar las tablas antes de cargarlas."],["Power Query","Revisa encabezados, tipos de datos, filas vacías y espacios en los códigos.","IDLibro e IDCliente: texto. Cantidad: número entero. Elimina duplicados solo cuando corresponda al significado de los datos."],["Cerrar y aplicar","En Power Query selecciona Inicio → Cerrar y aplicar.","Las tablas pasan al modelo. Puedes volver a Transformar datos si necesitas corregirlas."],["Claves","<div class='flow'><b>Libros<br>IDLibro único</b><span>1 ─── *</span><b>Ventas<br>IDLibro repetido</b></div>","La clave del lado uno debe ser única; la clave del lado muchos puede repetirse. Los tipos deben ser compatibles."],["Uno a uno (1:1)","<div class='flow'><b>Libro</b> 1 ─── 1 <b>Ficha técnica</b></div>","Cada clave se presenta como máximo una vez en cada tabla."],["Uno a muchos (1:N)","<div class='flow'><b>Clientes</b> 1 ─── * <b>Ventas</b></div>","Un cliente puede tener muchas ventas. Es la relación habitual del modelo estrella."],["Muchos a muchos (N:M)","<div class='flow'><b>Autores</b> * ─── * <b>Libros</b></div>","Power BI admite cardinalidad muchos a muchos. Una tabla puente AutorLibro con pares únicos suele facilitar un diseño más claro; revisa la propagación de filtros."],["Crear relaciones","Vista Modelo → arrastra Libros[IDLibro] a Ventas[IDLibro]. Repite con Clientes[IDCliente] y Ventas[IDCliente].","Edita la relación: uno a muchos, activa, dirección de filtro única desde dimensión hacia ventas."],["Modelo estrella","<div class='flow'><b>Libros</b> 1 ─ * <b>Ventas</b> * ─ 1 <b>Clientes</b></div>","Las dimensiones describen entidades; Ventas registra eventos. Evita rutas de filtro ambiguas."],["Primer gráfico","Vista Informe → gráfico de barras agrupadas → Título en eje de categorías y Cantidad en valores.","Selecciona Suma de Cantidad. Resultado: Matemática 18, Lengua 5, Ciencias 4."],["Tarjeta y segmentador","Agrega una tarjeta con Cantidad (Suma) y un segmentador con Clientes[Nombre].","El total inicial es 27 unidades. Selecciona un cliente para comprobar cómo cambian los gráficos."],["Simulación interactiva","<label>Cliente: <select id='cliente' onchange='demo()'><option value='all'>Todos</option><option value='C01'>Colegio Norte</option><option value='C02'>Colegio Sur</option></select></label><div id='grafico'></div>","Esta simulación reproduce el filtrado esperado con los datos de práctica."],["Diseñar el informe","Usa un título claro, una tarjeta de total, barras por libro y un segmentador por cliente.","Evita demasiados colores y verifica que las interacciones entre visuales sean las esperadas."],["Guardar y publicar","Archivo → Guardar como (.pbix). Para compartir en el servicio, usa Publicar y elige un área de trabajo autorizada.","Publicar y compartir pueden requerir cuenta organizacional, permisos y licencias. No publiques datos privados sin autorización."],["Práctica de 10 minutos","Importa las tres tablas, crea las dos relaciones y diseña un informe con barras, tarjeta y segmentador.<p><button onclick='timer()'>Iniciar 10 minutos</button> <strong id='reloj'>10:00</strong></p>","Comprueba el total de 27 y el total de 15 al seleccionar Colegio Norte."],["Comprobación final","<details><summary>¿Qué tabla debe tener códigos únicos?</summary>Libros y Clientes.</details><details><summary>¿Qué relación se usa con Ventas?</summary>Uno a muchos desde cada dimensión.</details><details><summary>¿Cuánto vendió Colegio Sur?</summary>12 unidades.</details>","Fin de la práctica. Guarda el informe en formato PBIX."]];let i=0,clock;const $=id=>document.getElementById(id);slides.forEach((s,j)=>$('jump').add(new Option((j+1)+'. '+s[0],j)));function show(){clearInterval(clock);$('num').textContent=(i+1)+' / '+slides.length;$('slide').innerHTML='<small>INTELIGENCIA DE NEGOCIOS · NIVEL INICIAL</small><h1>'+slides[i][0]+'</h1><div>'+slides[i][1]+'</div><div class="note">'+slides[i][2]+'</div>';$('jump').value=i;$('prev').disabled=i===0;$('next').disabled=i===slides.length-1;if($('cliente'))demo();window.scrollTo(0,0)}function move(n){i=Math.max(0,Math.min(slides.length-1,i+n));show()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('jump').onchange=e=>{i=+e.target.value;show()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});function demo(){let c=$('cliente').value,r=[['Matemática','C01',10],['Lengua','C01',5],['Matemática','C02',8],['Ciencias','C02',4]].filter(x=>c==='all'||x[1]===c),s={};r.forEach(x=>s[x[0]]=(s[x[0]]||0)+x[2]);$('grafico').innerHTML='<h2>Total: '+r.reduce((a,x)=>a+x[2],0)+'</h2>'+Object.entries(s).map(([k,v])=>'<div class="chartrow"><span>'+k+'</span><div><span class="bar" style="width:'+v/18*100+'%"></span></div><b>'+v+'</b></div>').join('')}function timer(){clearInterval(clock);let t=600;$('reloj').textContent='10:00';clock=setInterval(()=>{t--;$('reloj').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t===0)clearInterval(clock)},1000)}show();</script></body></html>
