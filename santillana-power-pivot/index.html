<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power Pivot · CEC-EPN</title><style>*{box-sizing:border-box}body{margin:0;font:18px/1.5 Arial;color:#18364d;background:#eef2f5}header,footer{padding:15px 5%;background:white;display:flex;justify-content:space-between;align-items:center}header{border-bottom:3px solid #175478;font-size:13px;font-weight:bold}main{max-width:1150px;margin:16px auto;background:white;padding:clamp(20px,5vw,55px);min-height:76vh}h1{font-size:clamp(28px,4vw,48px);line-height:1.15;margin:12px 0 25px}h3{color:#175478}button,select{font:inherit;padding:10px 16px;border:1px solid #175478;border-radius:5px;cursor:pointer;background:white;color:#175478}button:hover{background:#eaf3f8}button:disabled{opacity:.35}table{border-collapse:collapse;width:100%;font-size:17px}td,th{border:1px solid #dce4e8;padding:9px;text-align:left}th{background:#175478;color:white}.diagram{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:24px 0}.node{min-width:150px;border:1px solid #175478;border-radius:5px;padding:12px;background:#f5f9fc}.node b{display:block;border-bottom:1px solid #aac2d0;padding-bottom:6px}.line{font-weight:bold;color:#175478}.note{padding:16px;border-left:4px solid #175478;background:#edf5f9;margin-top:20px}.answer{display:none}.answer.show{display:block}.small{font-size:13px;color:#607487}code{background:#eff4f7;padding:4px;font-size:16px}@media(max-width:600px){main{margin:8px}footer{flex-wrap:wrap}table{font-size:13px}}</style><header><span>CEC-EPN · SANTILLANA</span><span id="num"></span></header><main id="slide"></main><footer><button id="prev">← Anterior</button><select id="jump" aria-label="Ir a diapositiva"></select><button id="next">Siguiente →</button></footer><script>
const node=(name,fields)=>`<div class="node"><b>${name}</b>${fields.join('<br>')}</div>`;const diagram=(a,af,l,b,bf)=>`<div class="diagram">${node(a,af)}<span class="line">${l}</span>${node(b,bf)}</div>`;const table=(headers,rows)=>`<table><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;const reveal=(q,a)=>`<p>${q}</p><button onclick="this.nextElementSibling.classList.toggle('show')">Mostrar / ocultar respuesta</button><div class="note answer">${a}</div>`;
const slides=[
['Power Pivot','<h3>Modelos de datos y relaciones entre tablas</h3><p>De varias hojas de Excel a un reporte integrado de ventas editoriales.</p><div class="note">Objetivo: relacionar datos sin repetir información y construir una tabla dinámica desde el modelo.</div>'],
['¿Qué es Power Pivot?','<p>Complemento de Excel que permite crear modelos de datos, relacionar tablas.</p>'+diagram('Libros',['Código','Título','Precio'],'→','Ventas',['Código','Cantidad','Fecha'])+'<p>Las tablas conservan su estructura; el modelo permite analizarlas juntas.</p>'],
['Activar Power Pivot','<ol><li>En Excel de escritorio para Windows: Archivo → Opciones.</li><li>Complementos → Administrar: Complementos COM → Ir.</li><li>Marca Microsoft Power Pivot para Excel y acepta.</li><li>Comprueba que aparezca la pestaña Power Pivot.</li></ol><div class="note">La disponibilidad depende de la edición y plataforma de Excel. Si no aparece, verifica la licencia y la instalación.</div>'],
['Caso editorial: tres tablas',table(['Libros: IDLibro','Título','Precio'],[['L01','Matemática',12],['L02','Lengua',15],['L03','Ciencias',18]])+'<br>'+table(['Clientes: IDCliente','Nombre'],[['C01','Colegio Norte'],['C02','Colegio Sur']])+'<br>'+table(['Ventas: IDVenta','IDLibro','IDCliente','Cantidad'],[['V01','L01','C01',10],['V02','L02','C01',5],['V03','L01','C02',8],['V04','L03','C02',4]])],
['Clave primaria y clave foránea',diagram('Libros',['IDLibro (único)','Título','Precio'],'1 ───── *','Ventas',['IDVenta (único)','IDLibro (repetido)','Cantidad'])+'<p><b>Clave primaria:</b> identifica cada registro sin duplicados. <b>Clave foránea:</b> referencia la clave de otra tabla; puede repetirse.</p>'],
['Relación uno a uno (1:1)',diagram('Libros',['IDLibro único','Título'],'1 ───── 1','Ficha técnica',['IDLibro único','Páginas'])+'<p>Cada libro corresponde como máximo a una ficha y viceversa. En un modelo de Excel esta relación puede representarse mediante columnas únicas; normalmente se considera combinar las tablas si tienen la misma granularidad.</p>'+reveal('¿Puede repetirse L01 en Ficha técnica?','No, perdería la cardinalidad uno a uno.')],
['Relación uno a muchos (1:N)',diagram('Libros',['L01','L02','L03'],'1 ───── *','Ventas',['V01 → L01','V02 → L02','V03 → L01'])+'<p>Un libro puede aparecer en múltiples ventas. Cada venta del ejemplo corresponde a un libro.</p>'+reveal('¿Cuál es el lado único?','Libros. IDLibro no debe repetirse en esa tabla.')],
['Relación muchos a muchos (N:M)',diagram('Autores',['A01','A02'],'* ───── *','Libros',['L01','L02'])+'<p>Un autor puede escribir varios libros y un libro puede tener varios autores.</p>'+diagram('Autores',['IDAutor'],'1 ─ *','AutorLibro',['IDAutor','IDLibro'])+diagram('Libros',['IDLibro'],'1 ─ *','AutorLibro',['IDAutor','IDLibro'])+'<div class="note">Power Pivot de Excel no admite una relación N:M directa convencional. Usa una tabla puente con pares únicos. Para esta clase, analiza los registros de la tabla puente; no presupongas que los filtros pasarán de una dimensión a otra.</div>'],
['Preparar las tablas','<ol><li>Escribe los datos en hojas separadas.</li><li>Selecciona cada rango → Ctrl + T → confirma encabezados.</li><li>En Diseño de tabla, asigna los nombres Libros, Clientes y Ventas.</li><li>Comprueba que las claves tengan el mismo tipo de dato y que el lado uno no tenga duplicados.</li></ol>'],
['Agregar al modelo de datos','<ol><li>Selecciona una celda de Libros.</li><li>Power Pivot → Agregar al modelo de datos.</li><li>Repite con Clientes y Ventas.</li><li>Power Pivot → Administrar para abrir el modelo.</li></ol><p>Alternativa: cargar consultas de Power Query al modelo de datos.</p>'],
['Crear una relación visual',diagram('Libros',['IDLibro','Título','Precio'],'1 ───── *','Ventas',['IDLibro','IDCliente','Cantidad'])+'<ol><li>En la ventana Power Pivot, selecciona Vista de diagrama.</li><li>Arrastra IDLibro de Libros hacia IDLibro de Ventas.</li><li>Repite con IDCliente de Clientes hacia Ventas.</li><li>Comprueba las líneas y sus cardinalidades.</li></ol>'],
['Modelo estrella','<div class="diagram">'+node('Libros · dimensión',['IDLibro único','Título'])+'<span class="line">1 ─ *</span>'+node('Ventas · hechos',['IDLibro','IDCliente','Cantidad'])+'<span class="line">* ─ 1</span>'+node('Clientes · dimensión',['IDCliente único','Nombre'])+'</div><p>Las dimensiones describen; la tabla de hechos registra eventos y cantidades. Los filtros de las dimensiones se propagan normalmente hacia la tabla de hechos.</p>'],
['Crear una tabla dinámica','<ol><li>En Power Pivot → Inicio → Tabla dinámica.</li><li>Elige una hoja nueva.</li><li>Arrastra Libros[Título] a Filas.</li><li>Arrastra Ventas[Cantidad] a Valores (Suma).</li><li>Agrega Clientes[Nombre] a Filtros.</li></ol>'+table(['Título','Suma de cantidad'],[['Matemática',18],['Lengua',5],['Ciencias',4],['Total',27]])],
['Simulación: filtra por cliente','<p>Selecciona un cliente para observar la propagación de filtros en el modelo de datos.</p><select id="client" onchange="filterDemo()"><option value="all">Todos</option><option value="C01">Colegio Norte</option><option value="C02">Colegio Sur</option></select><div id="results" style="margin-top:20px"></div>'],
['Errores comunes','<ul><li>Valores duplicados en la clave del lado uno.</li><li>Tipos de datos incompatibles entre claves.</li><li>Códigos de ventas que no existen en la dimensión.</li><li>Confundir filas de detalle con totales agregados.</li><li>Crear rutas de filtrado ambiguas.</li></ul>'+reveal('Si IDLibro se repite en Libros, ¿qué debes revisar?','Identificar la clave correcta o depurar la dimensión antes de crear la relación.')],
['Práctica · 10 minutos','<p>Crea las tres tablas de la diapositiva 4, agrégalas al modelo y establece sus relaciones.</p><ol><li>Construye el modelo estrella.</li><li>Genera una tabla dinámica por título y cliente.</li><li>Configura Cantidad como Suma en el área Valores.</li><li>Explica la cardinalidad de cada relación.</li></ol><button onclick="startTimer()">Iniciar temporizador</button> <strong id="timer">10:00</strong>'],
['Comprobación final',reveal('1. ¿Por qué no relacionamos Ventas con Libros mediante Título?','IDLibro es una clave estable y única; un título puede repetirse o cambiar.')+reveal('2. ¿Qué relación existe entre Clientes y Ventas?','Uno a muchos.')+reveal('3. ¿Qué usamos para representar autores y libros N:M?','Una tabla puente AutorLibro, con una fila por combinación de autor y libro.')]
];
let i=0,clock;const $=x=>document.getElementById(x);slides.forEach((s,j)=>$('jump').add(new Option((j+1)+'. '+s[0],j)));function show(){clearInterval(clock);$('num').textContent=(i+1)+' / '+slides.length;$('slide').innerHTML='<div class="small">POWER PIVOT · MODELO DE DATOS</div><h1>'+slides[i][0]+'</h1>'+slides[i][1];$('jump').value=i;$('prev').disabled=i===0;$('next').disabled=i===slides.length-1;if($('client'))filterDemo();window.scrollTo(0,0)}function move(n){i=Math.max(0,Math.min(slides.length-1,i+n));show()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('jump').onchange=e=>{i=+e.target.value;show()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});function filterDemo(){let c=$('client').value,raw=[['Matemática','C01',10],['Lengua','C01',5],['Matemática','C02',8],['Ciencias','C02',4]],r=raw.filter(x=>c==='all'||x[1]===c),sum={};r.forEach(x=>sum[x[0]]=(sum[x[0]]||0)+x[2]);$('results').innerHTML=table(['Título','Unidades'],[...Object.entries(sum),['Total',r.reduce((a,x)=>a+x[2],0)]])}function startTimer(){clearInterval(clock);let t=600;clock=setInterval(()=>{t--;if(!$('timer')){clearInterval(clock);return}$('timer').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t<=0)clearInterval(clock)},1000)}show();</script></html>
