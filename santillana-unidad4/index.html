<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEC-EPN · Unidad 4 Funciones Excel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#213448}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 30px;background:#fff;border-bottom:3px solid #1a5273;gap:12px}.brand{font-size:13px;font-weight:700;letter-spacing:1px;color:#1a5273}.counter{color:#66788a;font-size:13px}.stage{max-width:1150px;min-height:calc(100vh - 150px);margin:18px auto;background:white;box-shadow:0 10px 40px #16314b1a;border-radius:12px;padding:clamp(24px,5vw,68px);display:flex;flex-direction:column;justify-content:center}.kicker{color:#1677a2;text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:bold;margin-bottom:20px}.stage h1{font-size:clamp(34px,5vw,62px);line-height:1.14;letter-spacing:-1.5px;margin:0 0 20px}.stage h2{font-size:clamp(30px,4vw,52px);margin:0 0 22px}.desc{font-size:clamp(17px,2vw,23px);line-height:1.6;color:#4d6375;max-width:850px}.formula{background:#102b3e;color:#c8f2db;padding:22px 28px;border-radius:9px;font:clamp(16px,2.2vw,26px)/1.5 Consolas,monospace;overflow-wrap:anywhere;margin:20px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}.panel{background:#f4f8fa;border:1px solid #e1e8ec;padding:20px;border-radius:10px}.panel h3{font-size:14px;letter-spacing:1px;color:#1a5273;text-transform:uppercase;margin:0 0 12px}.panel p{line-height:1.6;margin:0}.reveal{display:none}.reveal.visible{display:block}.bar{max-width:1150px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.bar button{padding:12px 20px;background:#1a5273;color:#fff;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.bar button:disabled{opacity:.35}.bar button.secondary{background:#dbe5ec;color:#183e58}.small{font-size:12px;color:#6e7d87}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.pill{padding:7px 12px;background:#e8f2f7;color:#1a5273;border-radius:30px;font-size:13px}.progress{height:4px;background:#dce5ea}.progress div{height:100%;background:#1a5273;transition:width .2s}.foot{font-size:12px;color:#718091;margin-top:25px}@media(max-width:650px){.two{grid-template-columns:1fr}.top{padding:12px}.stage{margin:8px;min-height:70vh}.bar{padding:0 10px}.bar button{padding:11px}}</style></head><body><header class="top"><span class="brand">CEC-EPN | SANTILLANA</span><span class="counter" id="count"></span></header><div class="progress"><div id="progress"></div></div><main id="stage" class="stage"></main><nav class="bar"><button id="prev" class="secondary">← Anterior</button><button id="show" class="secondary">Mostrar ejemplo</button><button id="next">Siguiente →</button></nav><script>const SLIDES=[{"kind": "cover", "title": "Unidad 4 · Funciones en Excel", "desc": "Fecha · Texto · Matemáticas · Estadísticas · Lógicas · Anidación", "formula": "", "example": ""}, {"kind": "intro", "title": "Cómo trabajar esta unidad", "desc": "Abre el Excel de prácticas. Cada diapositiva muestra una función, un ejemplo y un reto. Los datos son ficticios y representan situaciones editoriales.", "formula": "", "example": ""}, {"kind": "section", "title": "Funciones de fecha", "desc": "4 funciones y aplicaciones prácticas", "formula": "", "example": ""}, {"kind": "function", "title": "HOY", "group": "Funciones de fecha", "formula": "=HOY()", "desc": "Devuelve la fecha actual del sistema", "example": "Registrar la fecha de actualización del inventario."}, {"kind": "function", "title": "AHORA", "group": "Funciones de fecha", "formula": "=AHORA()", "desc": "Devuelve la fecha y la hora actuales", "example": "Marcar cuándo se actualizó un reporte."}, {"kind": "function", "title": "DIAS360", "group": "Funciones de fecha", "formula": "=DIAS360(A2;B2)", "desc": "Calcula días entre dos fechas usando año comercial de 360 días", "example": "Estimar plazos comerciales entre fechas."}, {"kind": "function", "title": "FECHA", "group": "Funciones de fecha", "formula": "=FECHA(2026;11;12)", "desc": "Construye una fecha a partir de año, mes y día", "example": "Unificar fechas de entregas."}, {"kind": "section", "title": "Funciones de texto", "desc": "7 funciones y aplicaciones prácticas", "formula": "", "example": ""}, {"kind": "function", "title": "LARGO", "group": "Funciones de texto", "formula": "=LARGO(A2)", "desc": "Cuenta caracteres, incluidos espacios", "example": "Validar longitud de códigos editoriales."}, {"kind": "function", "title": "IZQUIERDA", "group": "Funciones de texto", "formula": "=IZQUIERDA(A2;3)", "desc": "Extrae caracteres iniciales", "example": "Identificar el prefijo de un ISBN o código."}, {"kind": "function", "title": "DERECHA", "group": "Funciones de texto", "formula": "=DERECHA(A2;4)", "desc": "Extrae caracteres finales", "example": "Obtener los últimos dígitos de una referencia."}, {"kind": "function", "title": "EXTRAE (MED)", "group": "Funciones de texto", "formula": "=EXTRAE(A2;4;3)", "desc": "Extrae caracteres desde una posición", "example": "Extraer un segmento de un código. En Excel español se usa EXTRAE."}, {"kind": "function", "title": "CONCATENAR", "group": "Funciones de texto", "formula": "=CONCATENAR(A2;\" - \";B2)", "desc": "Une fragmentos de texto", "example": "Crear etiquetas de libros y colecciones."}, {"kind": "function", "title": "ENCONTRAR", "group": "Funciones de texto", "formula": "=ENCONTRAR(\"-\";A2)", "desc": "Encuentra la posición de una cadena; distingue mayúsculas", "example": "Ubicar separadores en códigos."}, {"kind": "function", "title": "REPETIR", "group": "Funciones de texto", "formula": "=REPETIR(\"■\";B2)", "desc": "Repite un texto un número de veces", "example": "Crear barras visuales simples."}, {"kind": "section", "title": "Funciones matemáticas", "desc": "4 funciones y aplicaciones prácticas", "formula": "", "example": ""}, {"kind": "function", "title": "SUMA", "group": "Funciones matemáticas", "formula": "=SUMA(B2:B8)", "desc": "Suma valores numéricos", "example": "Totalizar unidades vendidas."}, {"kind": "function", "title": "RESIDUO (RESTO)", "group": "Funciones matemáticas", "formula": "=RESIDUO(B2;C2)", "desc": "Devuelve el resto de una división", "example": "Calcular ejemplares que sobran al formar paquetes."}, {"kind": "function", "title": "PRODUCTO", "group": "Funciones matemáticas", "formula": "=PRODUCTO(B2;C2)", "desc": "Multiplica valores", "example": "Calcular importe por cantidad y precio."}, {"kind": "function", "title": "POTENCIA", "group": "Funciones matemáticas", "formula": "=POTENCIA(B2;2)", "desc": "Eleva un número a una potencia", "example": "Practicar crecimiento cuadrático."}, {"kind": "section", "title": "Funciones estadísticas", "desc": "4 funciones y aplicaciones prácticas", "formula": "", "example": ""}, {"kind": "function", "title": "PROMEDIO", "group": "Funciones estadísticas", "formula": "=PROMEDIO(B2:B8)", "desc": "Obtiene la media aritmética", "example": "Promedio de ventas."}, {"kind": "function", "title": "MAX", "group": "Funciones estadísticas", "formula": "=MAX(B2:B8)", "desc": "Obtiene el mayor valor", "example": "Identificar la venta máxima."}, {"kind": "function", "title": "MIN", "group": "Funciones estadísticas", "formula": "=MIN(B2:B8)", "desc": "Obtiene el menor valor", "example": "Identificar la venta mínima."}, {"kind": "function", "title": "CONTAR", "group": "Funciones estadísticas", "formula": "=CONTAR(B2:B8)", "desc": "Cuenta celdas numéricas", "example": "Contar registros con cantidades numéricas."}, {"kind": "section", "title": "Funciones lógicas", "desc": "4 funciones y aplicaciones prácticas", "formula": "", "example": ""}, {"kind": "function", "title": "SI", "group": "Funciones lógicas", "formula": "=SI(B2>=50;\"Meta cumplida\";\"Revisar\")", "desc": "Devuelve resultados según una condición", "example": "Marcar metas de venta."}, {"kind": "function", "title": "SI.ERROR", "group": "Funciones lógicas", "formula": "=SI.ERROR(B2/C2;\"Revisar divisor\")", "desc": "Sustituye errores por un resultado alternativo", "example": "Evitar errores visibles en un reporte, tras revisar su causa."}, {"kind": "function", "title": "Y", "group": "Funciones lógicas", "formula": "=Y(B2>=50;C2>0)", "desc": "Verdadero si todas las condiciones se cumplen", "example": "Comprobar meta y stock positivo."}, {"kind": "function", "title": "O", "group": "Funciones lógicas", "formula": "=O(B2>=50;C2>0)", "desc": "Verdadero si alguna condición se cumple", "example": "Detectar pedidos que cumplen alguna regla."}, {"kind": "section", "title": "Anidación de funciones", "desc": "2 funciones y aplicaciones prácticas", "formula": "", "example": ""}, {"kind": "function", "title": "SI + Y", "group": "Anidación de funciones", "formula": "=SI(Y(B2>=50;C2>0);\"Aprobado\";\"Revisar\")", "desc": "Combina dos condiciones dentro de SI", "example": "Validar meta y disponibilidad."}, {"kind": "function", "title": "SI + SI.ERROR", "group": "Anidación de funciones", "formula": "=SI.ERROR(SI(B2/C2>=1;\"Cumple\";\"No cumple\");\"Dato inválido\")", "desc": "Controla errores de una condición calculada", "example": "Evaluar indicadores con divisores que pueden ser cero."}, {"kind": "challenge", "title": "Reto integrador Santillana", "desc": "En la hoja Reto, calcula importe, clasificación de meta, extracción de código, resumen de ventas y fecha de actualización. Combina SI con Y y SI.ERROR.", "formula": "=SI(Y(D2>=50;E2>0);\"Meta lograda\";\"Revisar\")", "example": "Primero intenta resolverlo sin mirar las diapositivas."}, {"kind": "end", "title": "Cierre de la Unidad 4", "desc": "Comprueba resultados, revisa separadores de argumentos (; o ,) y entrega tu archivo con las fórmulas visibles.", "formula": "", "example": ""}];const slides=SLIDES;let pos=0,revealed=false;const $=id=>document.getElementById(id);function safe(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function render(){let s=slides[pos];$('count').textContent=(pos+1)+' / '+slides.length;$('progress').style.width=((pos+1)/slides.length*100)+'%';$('prev').disabled=pos===0;$('next').disabled=pos===slides.length-1;$('show').style.display=s.kind==='function'||s.kind==='challenge'?'inline-block':'none';$('show').textContent=revealed?'Ocultar ejemplo':'Mostrar ejemplo';let head='<div class="kicker">CEC-EPN · SANTILLANA · '+safe(s.group||'UNIDAD 4')+'</div>';let body='<h1>'+safe(s.title)+'</h1><p class="desc">'+safe(s.desc)+'</p>';if(s.formula){body+='<div class="formula">'+safe(s.formula)+'</div><div class="two"><div class="panel"><h3>¿Dónde se usa?</h3><p>'+safe(s.example)+'</p></div><div class="panel"><h3>Actividad para practicar</h3><p>Escribe la fórmula en Excel y cambia un dato para observar cómo se actualiza el resultado.</p></div></div><div class="panel reveal '+(revealed?'visible':'')+'" style="margin-top:16px"><h3>Paso a paso</h3><p>1. Selecciona la celda del resultado. 2. Escribe la fórmula. 3. Presiona Enter. 4. Comprueba el valor y revisa el separador regional.</p></div>'}else if(s.kind==='section'){body+='<div class="pills"><span class="pill">Explicación</span><span class="pill">Ejemplo</span><span class="pill">Práctica</span></div>'}body+='<div class="foot">Unidad 4 · Funciones de Excel · Ejemplos de contexto editorial</div>';$('stage').innerHTML=head+body}function move(n){pos=Math.max(0,Math.min(slides.length-1,pos+n));revealed=false;render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('show').onclick=()=>{revealed=!revealed;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();</script></body></html>
