ra de fórmulas.","Cambia a General y comprueba que el dato no cambió."],"exercise":null,"kind":"lesson","contexto":"Un libro con precio 1250,5 puede visualizarse como $ 1.250,50. Excel conserva el número original para calcular totales y descuentos."},{"section":"1.1.1","title":"¿Dónde se crean los formatos personalizados?","subtitle":"Abrir Formato de celdas","rows":["Selecciona una celda o rango","Presiona Ctrl + 1 (Windows)","Abre la pestaña Número → Personalizada","En Tipo escribe el código de formato y acepta"],"steps":["Selecciona B2:B6.","Pulsa Ctrl + 1.","Elige Número → Personalizada.","Escribe el código 00000 y pulsa Aceptar."],"exercise":null,"kind":"lesson","contexto":"Los códigos internos de los libros pueden ser 7, 52 y 839, pero Santillana podría mostrarlos como 00007, 00052 y 00839 sin convertirlos en texto."},{"section":"1.1.1","title":"Códigos básicos de números","subtitle":"Símbolos que debes reconocer","rows":["0 → dígito obligatorio; completa con ceros"," # → dígito opcional; no agrega ceros innecesarios","? → reserva espacios para alinear dígitos","0,00 → dos decimales en configuración con coma decimal","\"texto\" → muestra texto literal junto al valor"],"steps":[],"exercise":null,"kind":"lesson","contexto":"En un catálogo editorial, los identificadores deben verse uniformes: 00007 y 00052. Practicarás cómo aplicar ese formato a una columna."},{"section":"1.1.1","title":"Ejercicio 1 · Códigos con ceros","subtitle":"Transforma identificadores sin modificar el número","rows":["A2 = 7 → 00007","A3 = 52 → 00052","A4 = 839 → 00839","Código personalizado: 00000"],"steps":["En la hoja «Ejercicio 1», haz clic en A2 y arrastra hasta A4. NO selecciones la columna B: es solo el resultado esperado.","En la cinta de Excel, abre la pestaña Inicio. Localiza el grupo Número y pulsa la flecha pequeña de su esquina inferior derecha (o Ctrl + 1).","En «Formato de celdas», abre la pestaña Número. En Categoría, haz clic en Personalizada.","En el cuadro Tipo, escribe ucto tiene menos de 6 ejemplares, Excel puede marcarlo en rojo para facilitar la reposición del inventario."},{"section":"1.1.2","title":"Ejercicio 3 · Notas aprobadas","subtitle":"Resalta notas iguales o superiores a 7","rows":["A2 Ana · B2 8,5","A3 Luis · B3 5,0","A4 María · B4 9,2","A5 José · B5 6,8","Objetivo: colorear 8,5 y 9,2"],"steps":["En la hoja de notas, comprueba que A1 dice Estudiante y B1 dice Nota; los datos están en A2:B5.","Haz clic en B2 y arrastra hasta B5 para seleccionar solo las cuatro notas.","En la cinta, haz clic en Inicio → Formato condicional → Reglas para resaltar celdas → Es mayor o igual que (si no aparece, elige Nueva regla y configura «Valor de la celda ≥ 7»).","En la ventana de la regla, escribe 7. Elige «Formato personalizado», pestaña Relleno, selecciona verde claro y confirma con Aceptar.","Comprueba que B2 (8,5) y B4 (9,2) están verdes. B3 (5,0) y B5 (6,8) no deben resaltarse."],"exercise":"¿Qué celdas deben verse verdes?","kind":"exercise","contexto":"En un seguimiento de capacitaciones, una nota de 8,5 puede aparecer en verde porque supera el mínimo de aprobación de 7."},{"section":"1.1.2","title":"Ejercicio 4 · Barras de datos","subtitle":"Compara ventas sin crear un gráfico","rows":["B2 = 120","B3 = 250","B4 = 90","B5 = 310","La barra más larga debe corresponder a 310"],"steps":["En la hoja «Barras de datos», escribe las ventas en B2:B5 como indica la tabla.","Haz clic en B2, mantén presionado y arrastra hasta B5.","En Inicio, pulsa Formato condicional → Barras de datos.","En «Relleno degradado» o «Relleno sólido», elige una barra azul. Observa la longitud de cada barra.","Haz clic en B4, cambia 90 por 400 y pulsa Enter. Comprueba que ahora esa barra es la más larga."],"exercise":null,"kind":"lesson","contexto":"En un reporte de distribución, las barras permiten comparar visualmente cuántos libros vendió cada sede sin crear un gráfico."},{"section":"1.1.2","title":"Ejercicio 5 · Escalas de color","subtitle":"Detecta rápidamen function render(){const s=slides[current];let body='';if(s.kind==='cover'){body=`<div class="cover"><div class="eyebrow">CEC · EPN · EXCEL</div><h1>${esc(s.title)}</h1><p>${esc(s.subtitle)}</p><div class="contexto-santillana"><strong>Ejemplo aplicado a Santillana</strong><p>${esc(s.contexto)}</p></div><div class="topics">${s.rows.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p class="tiny">Presentación interactiva · Utiliza Siguiente y Anterior</p></div>`}else{body=`<div class="eyebrow">${esc(s.section)} · CEC-EPN</div><h1 class="heading">${esc(s.title)}</h1><p class="subtitle">${esc(s.subtitle)}</p><div class="contexto-santillana"><strong>¿Qué haremos y para qué sirve?</strong><p>${esc(s.contexto)}</p></div><div class="layout"><div class="panel"><h3>Conceptos y datos de trabajo</h3><ul class="points">${s.rows.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${s.exercise?`<div class="exercise"><strong>Comprueba tu aprendizaje</strong><p>${esc(s.exercise)}</p><button onclick="toggleAnswer()">${showAnswer?'Ocultar':'Ver'} respuesta</button><div class="answer ${showAnswer?'show':''}">${esc(answerFor(current))}</div></div>`:''}</div><div class="panel"><h3>${s.steps.length?'Resolución paso a paso':'Práctica visual de Excel'}</h3>${s.steps.length?`<p class="muted">Sigue cada clic en Excel y avanza para ver el cambio en la simulación.</p>${s.steps.length?`<div class="inline-controls"><button type="button" onclick="showPreviousStep()" ${visible===0?'disabled':''}>◀ Paso anterior</button><button type="button" class="step-next" onclick="showNextStep()" ${visible>=s.steps.length?'disabled':''}>${visible>=s.steps.length?'✓ Completado':'Mostrar paso '+(visible+1)+' de '+s.steps.length+' ▶'}</button><button type="button" onclick="showAllSteps()">Ver todos</button></div>`:''}${s.steps.slice(0,visible).map((x,i)=>`<div class="step"><strong>${i+1}.</strong> ${esc(x)}</div>`).join('')}${visible===0?'<p class="muted">Los pasos aparecerán aquí.</p>':''}`:`<p class="muted">Utiliza los datos del panel izquierdo y practica en tu propio archivo de Excel.</p>`}<div class="sheet">${sheetFor(s)}</div><p class="tiny">Simulación dinámica: observa cómo cambia la hoja al avanzar cada paso. Los separadores dependen de la configuración regional.</p>${s.section==='1.1.2'?`<div class="demo"><label>Prueba un umbral: <input type="number" id="threshold" value="6" min="0" max="20" oninput="demo()"></label></div><output id="demoOutput"></output>`:''}</div></div>`}el('content').innerHTML=body;el('counter').textContent=`${current+1} / ${slides.length} · ${s.section}`;el('prev').disabled=current===0;el('next').disabled=current===slides.length-1;el('reveal').disabled=!s.steps.length||visible>=s.steps.length;el('reveal').textContent=visible>=s.steps.length?'Pasos completos':`Mostrar paso (${visible}/${s.steps.length})`;el('bar').style.width=((current+1)/slides.length*100)+'%';if(s.section==='1.1.2')demo();}

function sheetFor(s){

 let target=[], selection='', note='', styles={}, format=(v)=>String(v);

 const money=v=>'$ '+Number(v).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});
 if(t.includes('Notas aprobadas')||t.includes('Reglas con fórmula')){
   headers=['Estudiante','Nota','Estado'];rows=[['Ana',8.5,''],['Luis',5,''],['María',9.2,''],['José',6.8,'']];
   if(n>=1){rows.forEach((r,i)=>set(i,1,r[1].toLocaleString('es-EC',{minimumFractionDigits:1})));note='Datos de calificaciones ingresados en A1:B5.'}

   if(n>=4){rows.forEach((r,i)=>{if(Number(String(r[1]).replace(',','.'))>=7){styles[cell(i,1)]='background:#b9efc9;color:#136b35;font-weight:bold;';}});note='Regla aplicada: notas mayores o iguales a 7.'}

 }else if(t.includes('Códigos con ceros')||t.includes('¿Dónde se crean')){

 }else if(t.includes('Etiquetas')){

   if(n>=3)note='En Personalizada escribe: 0 "kg".';
   if(n>=4){rows=rows.map(r=>[r[0]+' kg']);note='Las unidades aparecen sin convertir los números en texto.'}
 }else if(t.includes('Barras de datos')){
   headers=['Producto','Venta'];rows=[['Mouse',120],['Teclado',250],['Monitor',90],['Laptop',310]];
   if(n>=1){rows.forEach((r,i)=>mark(i,1));note='Selecciona los importes de venta.'}
   if(n>=2)note='Inicio → Formato condicional → Barras de datos.';
   if(n>=3){rows.forEach((r,i)=>styles[cell(i,1)]='background:linear-gradient(90deg,#a9d7f3 '+Math.round(r[1]/310*100)+'%,white '+Math.round(r[1]/310*100)+'%);');note='Las barras muestran la proporción de cada venta.'}
   if(n>=4)note='Compara visualmente los importes: Laptop es el mayor.';
 }else if(t.includes('Escalas de color')){
   headers=['Valor'];rows=[[15],[30],[55],[80],[100]];
   if(n>=1){rows.forEach((r,i)=>mark(i,0));note='Rango seleccionado.'}
   if(n>=2)note='Inicio → Formato condicional → Escalas de color.';
   if(n>=3){rows.forEach((r,i)=>styles[cell(i,0)]='background:'+(['#f8c9c9','#f6dfab','#fff3ae','#c9e9b4','#a4dfbd'][i])+';color:#26354a;font-weight:bold;');note='Escala de rojo a verde aplicada.'}
 }else if(t.includes('Presupuesto')){
   headers=['Importe','Tasa','Fecha','Avance'];rows=[[1250.5,.18,'04/11/2026',.75]];
   if(n>=1){mark(0,0);note='Selecciona el importe.'}
   if(n>=2){set(0,0,money(1250.5));note='Formato Moneda aplicado al importe.'}
   if(n>=3){set(0,0,money(1250.5));set(0,1,'18 %');note='Formato Porcentaje aplicado a la tasa.'}
   if(n>=4){set(0,0,money(1250.5));set(0,1,'18 %');note='Formato Fecha aplicado a la columna de fecha.'}
   if(n>=5){rows=[[money(1250.5),'18 %','04/11/2026','75 %']];note='Todos los valores tienen el formato solicitado.'}
 }else if(t.includes('Separadores')){
   headers=['Valor'];rows=[[1200.5],[980.75],[15200]];
   if(n>=1){rows.forEach((r,i)=>mark(i,0));note='Valores seleccionados.'}
   if(n>=2)note='Ctrl + 1 → Número → 2 decimales.';
   if(n>=3){rows=rows.map(r=>[Number(r[0]).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2})]);note='Se muestran dos decimales y separadores de miles.'}
 }else if(t.includes('Restaurar')){
   headers=['Importe','Porcentaje'];rows=[['$ 1.500,00','20 %'],['$ 900,00','15 %']];
   if(n>=1){rows.forEach((r,i)=>headers.forEach((_,j)=>mark(i,j)));note='Selecciona las celdas que deseas restaurar.'}
   if(n>=2)note='Inicio → Borrar → Borrar formatos.';
   if(n>=3){rows=[[1500,.2],[900,.15]];note='Los formatos se quitaron; los valores permanecen.'}
   if(n>=4)note='Comprueba que las celdas conservan sus datos.';
 }else if(t.includes('inventario')){
   headers=['Producto','Cantidad','Precio','Descuento'];rows=[['Mouse',5,12.5,.1],['Teclado',12,25.5,.05],['Monitor',2,185,.15]];
   if(n>=1){rows.forEach((r,i)=>mark(i,1));note='Datos del inventario preparados.'}
   if(n>=2){rows.forEach((r,i)=>set(i,2,money(r[2])));note='Precios formateados como moneda.'}
   if(n>=3){rows.forEach((r,i)=>set(i,3,Math.round(r[3]*100)+' %'));note='Descuentos formateados como porcentajes.'}
   if(n>=4){rows.forEach((r,i)=>{if(r[1]<6)styles[cell(i,1)]='background:#ffd5d5;color:#9b2323;font-weight:bold;'});note='Formato condicional: cantidades menores que 6.'}
   if(n>=5)note='Revisa los resultados y comprueba que los valores originales no cambiaron.';
 }else if(t.includes('Dato ≠ apariencia')){
   headers=['Valor en Excel'];rows=[[1250.5]];
   if(n>=1){mark(0,0);note='Se escribe el valor numérico original.'}
   if(n>=2){set(0,0,money(1250.5));note='El formato Moneda cambia la visualización.'}
   if(n>=3){set(0,0,money(1250.5));note='La barra de fórmulas conserva el valor 1250,5.'}
   if(n>=4)note='Al volver a General, aparece de nuevo el valor numérico.';
 }else{
   rows=rows.map(r=>[r[0],r[1],money(r[2]),Math.round(r[3]*100)+' %']);
   if(n>0){mark(0,0);note='Paso '+n+': '+s.steps[n-1];}
 }
 if(n===0)note='Estado inicial de la hoja: pulsa «Mostrar paso 1» para comenzar.';
 const head='<tr><th></th>'+headers.map((_,i)=>'<th>'+String.fromCharCode(65+i)+'</th>').join('')+'</tr>';
 const names='<tr><th>1</th>'+headers.map(x=>'<td class="head">'+esc(x)+'</td>').join('')+'</tr>';
 const cells=rows.map((row,i)=>'<tr><th>'+(i+2)+'</th>'+row.map((v,j)=>'<td style="'+(styles[cell(i,j)]||'')+'">'+esc(v)+'</td>').join('')+'</tr>').join('');
 return '<div class="excel-status"><span class="excel-pill">EXCEL · '+(n===0?'INICIO':done?'RESULTADO':'PASO '+n+' / '+s.steps.length)+'</span> '+esc(note)+'</div><table>'+head+names+cells+'</table>';
}
function answerFor(i){const t=slides[i].title;if(t.includes('Códigos con ceros'))return '00042';if(t.includes('Etiquetas'))return 'Porque el valor sigue siendo numérico y puede utilizarse en cálculos.';if(t.includes('Notas aprobadas'))return 'B2 y B4 (8,5 y 9,2).';if(t.includes('Presupuesto'))return '75 %.';if(t.includes('Restaurar'))return 'Inicio → Borrar → Borrar formatos.';if(t.includes('integrador'))return 'Mouse y Monitor (cantidades 5 y 2).';return 'Revisa los pasos y los datos del ejemplo.'}
function demo(){const v=Number(el('threshold')?.value||0),nums=[12,5,2];if(el('demoOutput'))el('demoOutput').innerHTML='Cantidad menor que '+v+': '+nums.map(n=>`<strong style="padding:5px 9px;margin:4px;display:inline-block;background:${n<v?'#ffd7d7':'#eaf2f5'}">${n}</strong>`).join('')}
function toggleAnswer(){showAnswer=!showAnswer;render()}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));visible=0;showAnswer=false;render()}
el('prev').onclick=()=>go(current-1);el('next').onclick=()=>go(current+1);el('reveal').onclick=()=>{if(visible<slides[current].steps.length){visible++;render()}};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key===' '){e.preventDefault();if(visible<slides[current].steps.length){visible++;render()}}});render();
</script></body></html>
